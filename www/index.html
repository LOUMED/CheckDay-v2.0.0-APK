          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      },
      remove(key) {
        try {
          localStorage.removeItem(key);
        } catch {}
      },
    };

    async function hashPin(pin) {
      try {
        const enc = new TextEncoder().encode('checkday_salt_' + pin);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf))
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      } catch {
        return btoa('checkday_salt_' + pin);
      }
    }

    const SilentSync = {
      enqueue(action) {
        const q = Storage.get(KEYS.SYNC_QUEUE, []);
        q.push({ ...action, ts: Date.now() });
        Storage.set(KEYS.SYNC_QUEUE, q);
        this.flush();
      },
      async flush() {
        if (!supabaseClient || !navigator.onLine) return;
        const q = Storage.get(KEYS.SYNC_QUEUE, []);
        if (!q.length) return;
        const remaining = [];
        for (const item of q) {
          try {
            let res = null;
            if (item.type === 'upsert_profile') {
              res = await supabaseClient.from('profiles').upsert(item.payload, { onConflict: 'id' });
              if (res?.error && String(res.error.message || '').includes('column')) {
                const { anchor_shift, anchor_week_start, ...corePayload } = item.payload;
                res = await supabaseClient.from('profiles').upsert(corePayload, { onConflict: 'id' });
              }
            } else if (item.type === 'upsert_attendance') {
              res = await supabaseClient
                .from('attendance_records')
                .upsert(item.payload, { onConflict: 'user_id,work_date' });
            } else if (item.type === 'delete_attendance') {
              res = await supabaseClient
                .from('attendance_records')
                .delete()
                .eq('user_id', item.payload.user_id)
                .eq('work_date', item.payload.work_date);
            } else if (item.type === 'upsert_bonus') {
              res = await supabaseClient.from('bonuses').upsert(item.payload, { onConflict: 'id' });
            } else if (item.type === 'delete_bonus') {
              res = await supabaseClient.from('bonuses').delete().eq('id', item.payload.id);
            } else if (item.type === 'upsert_payroll') {
              res = await supabaseClient
                .from('payroll_settings')
                .upsert(item.payload, { onConflict: 'user_id' });
            }
            if (res?.error) throw res.error;
          } catch {
            remaining.push(item);
          }
        }
        Storage.set(KEYS.SYNC_QUEUE, remaining);
      },
    };

    if (typeof window !== 'undefined') {
      window.addEventListener('online', () => SilentSync.flush());

    /* =========================================================================
       3. ORGANIC WEB AUDIO API SOUND ENGINE (Zero harsh beeps)
       ========================================================================= */
    class OrganicSoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = Storage.get(KEYS.SOUND_MUTED, false);
      }

      ensureContext() {
        if (this.muted) return null;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return this.ctx;
        } catch {
          return null;
        }
      }

      setMuted(val) {
        this.muted = val;
        Storage.set(KEYS.SOUND_MUTED, val);
      }

      playTone(freq, startOffset, duration, type = 'sine', peakGain = 0.08, cutoff = 1400) {
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime + startOffset;
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(cutoff, now);
        filter.Q.setValueAtTime(1.2, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(peakGain, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      play(kind) {
        if (this.muted) return;
        switch (kind) {
          case 'tap':
            // Soft marimba-like wooden tick
            this.playTone(420, 0, 0.065, 'triangle', 0.06, 1100);
            break;
          case 'nav':
            // Airy soft glide
            this.playTone(330, 0, 0.08, 'sine', 0.05, 950);
            this.playTone(440, 0.035, 0.09, 'sine', 0.045, 1100);
            break;
          case 'success':
            // Warm kalimba triad (C5 - E5 - G5)
            this.playTone(523.25, 0, 0.22, 'triangle', 0.075, 1600);
            this.playTone(659.25, 0.065, 0.24, 'triangle', 0.07, 1700);
            this.playTone(783.99, 0.13, 0.32, 'sine', 0.08, 1900);
            break;
          case 'coin':
            // Crystal chime (A5 -> E6)
            this.playTone(880, 0, 0.16, 'sine', 0.06, 2200);
            this.playTone(1318.5, 0.07, 0.34, 'sine', 0.065, 2600);
            break;
          case 'absent':
            // Soft woody double-tap
            this.playTone(210, 0, 0.085, 'triangle', 0.07, 650);
            this.playTone(170, 0.095, 0.11, 'triangle', 0.065, 550);
            break;
          default:
            break;
        }
      }
    }

    function getMoroccoDateParts(dateObj = new Date()) {
      const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Africa/Casablanca',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      });
      const parts = {};
      for (const p of fmt.formatToParts(dateObj)) {
        parts[p.type] = p.value;
      }
      const hour = parts.hour === '24' ? '00' : parts.hour;
      return {
        year: Number(parts.year),
        month: Number(parts.month),
        day: Number(parts.day),
        iso: `${parts.year}-${parts.month}-${parts.day}`,
        time: `${hour}:${parts.minute}:${parts.second}`,
      };
    }

    function parseIsoDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
    }

    function toIsoDate(utcDate) {
      const y = utcDate.getUTCFullYear();
      const m = String(utcDate.getUTCMonth() + 1).padStart(2, '0');
      const d = String(utcDate.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getDayOfWeek(iso) {
      // 0 = Sunday, 5 = Friday, 6 = Saturday
      return parseIsoDate(iso).getUTCDay();
    }

    function getCycleRange(referenceIso) {
      const [y, m, d] = referenceIso.split('-').map(Number);
      let startY = y, startM = m;
      let endY = y, endM = m;
      if (d >= 18) {
        // 18th of current month to 17th of next month
        if (m === 12) {
          endY = y + 1;
          endM = 1;
        } else {
          endM = m + 1;
        }
      } else {
        // 18th of previous month to 17th of current month
        if (m === 1) {
          startY = y - 1;
          startM = 12;
        } else {
          startM = m - 1;
        }
      }
      const startIso = `${startY}-${String(startM).padStart(2, '0')}-18`;
      const endIso = `${endY}-${String(endM).padStart(2, '0')}-17`;
      const cycleKey = `${endY}-${String(endM).padStart(2, '0')}`;

      const days = [];
      const cursor = parseIsoDate(startIso);
      const endDate = parseIsoDate(endIso);
      while (cursor <= endDate) {
        days.push(toIsoDate(cursor));
        cursor.setUTCDate(cursor.getUTCDate() + 1);
      }
      return { startIso, endIso, cycleKey, days };
    }

    function calcTimeDurationHours(startTime, endTime) {
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      let diff = eh * 60 + em - (sh * 60 + sm);
      if (diff <= 0) diff += 24 * 60;
      // For standard Shift Normal (08:30 -> 17:30 = 9h span including 1h lunch break = 8h paid)
      const rawHours = diff / 60;
      if (startTime === '08:30' && rawHours >= 8.5) {
        return Math.max(0.5, Number((rawHours - 1).toFixed(2)));
      }
      return Math.max(0.5, Number(rawHours.toFixed(2)));
    }

    function getMondayOfIso(iso) {
      const d = parseIsoDate(iso);
      const dow = d.getUTCDay(); // 0=Sun, 1=Mon
      const diff = dow === 0 ? -6 : 1 - dow;
      d.setUTCDate(d.getUTCDate() + diff);
      return toIsoDate(d);
    }

    // Automatic weekly rotation: Morning (06:00) -> Night (22:00) -> Afternoon (14:00) -> Morning
    function getAutoRotatingShift(profile, dateIso) {
      if (!profile || profile.shift_category === 'normal') return 'normal';
      const order = ['morning', 'night', 'afternoon'];
      const anchorShift = order.includes(profile.anchor_shift) ? profile.anchor_shift : 'morning';
      const anchorMon = profile.anchor_week_start || getMondayOfIso(dateIso);
      const targetMon = getMondayOfIso(dateIso);
      const msDiff = parseIsoDate(targetMon).getTime() - parseIsoDate(anchorMon).getTime();
      const weeksDiff = Math.round(msDiff / (7 * 24 * 60 * 60 * 1000));
      const baseIdx = order.indexOf(anchorShift);
      const rotatedIdx = ((baseIdx + weeksDiff) % 3 + 3) % 3;
      return order[rotatedIdx];
    }

    // 40-minute pre-shift auto-detection window
    function getPreShiftInfo(nowMa, shiftType) {
      const [hh, mm] = nowMa.time.split(':').map(Number);
      const nowMins = hh * 60 + mm;
      const starts = {
        normal: { mins: 8 * 60 + 30, label: '08:30' },
        morning: { mins: 6 * 60, label: '06:00' },
        afternoon: { mins: 14 * 60, label: '14:00' },
        night: { mins: 22 * 60, label: '22:00' },
      };
      const target = starts[shiftType] || starts.normal;
      const diff = target.mins - nowMins;
      return {
        isPreShiftWindow: diff > 0 && diff <= 40,
        minutesLeft: diff,
        startLabel: target.label,
      };
    }

    function compareVersions(a, b) {
      const pa = String(a || '0').split('.').map(Number);
      const pb = String(b || '0').split('.').map(Number);
      for (let i = 0; i < 3; i++) {
        if ((pa[i] || 0) > (pb[i] || 0)) return 1;
        if ((pa[i] || 0) < (pb[i] || 0)) return -1;
      }
      return 0;

    function CheckDayLogo({ size = 38, showWordmark = true, light = false }) {
      return (
        <div className="inline-flex items-center gap-2.5 select-none" dir="ltr">
          <svg
            width={size}
            height={size}
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="CheckDay Logo"
          >
            <defs>
              <linearGradient id="cdSquircle" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#0B1D3A" />
                <stop offset="65%" stopColor="#163466" />
                <stop offset="100%" stopColor="#0D525E" />
              </linearGradient>
              <linearGradient id="cdEmerald" x1="14" y1="46" x2="52" y2="16" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#00A884" />
                <stop offset="60%" stopColor="#00C29A" />
                <stop offset="100%" stopColor="#6EE7D2" />
              </linearGradient>
            </defs>
            {/* Soft Squircle Base */}
            <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#cdSquircle)" />
            <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="17.25" stroke="rgba(110,231,210,0.28)" strokeWidth="1.5" />
            {/* Subtle Ambient Pulse Arc */}
            <path
              d="M14 42C19 42 21 35 25 35C29 35 30 43 35 43C40 43 44 26 51 20"
              stroke="rgba(110,231,210,0.22)"
              strokeWidth="3"
              strokeLinecap="round"
            />
            {/* Geometric Rising Checkmark Badge */}
            <path
              d="M17.5 33.5L27 43L47.5 21.5"
              stroke="url(#cdEmerald)"
              strokeWidth="6.2"
              strokeLinecap="round"
              strokeLinejoin="round"
            />
            {/* Mint Highlight Spark */}
            <circle cx="48.5" cy="20.5" r="3.2" fill="#6EE7D2" />
          </svg>
          {showWordmark && (
            <span
              className={`font-latin font-extrabold tracking-tight text-[19px] leading-none ${
                light ? 'text-white' : 'text-[#0B1D3A]'
              }`}
            >
              Check<span className="text-[#00C29A]">Day</span>
            </span>
          )}
        </div>
      );

    function LtrNum({ children, className = '' }) {
      return <span className={`font-mono-num ${className}`}>{children}</span>;

    function fmtMoney(val, currency) {
      const n = Number(val || 0);
      return `${n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${currency}`;
    }

      const [isPinUnlocked, setIsPinUnlocked] = useState(() => !Storage.get(KEYS.PIN_HASH, null));

      const [regAnchorShift, setRegAnchorShift] = useState('morning');
      const [showUpdateModal, setShowUpdateModal] = useState(false);
      const [showProModal, setShowProModal] = useState(false);

      // Live Remote Refresh Helper (Config, Holidays, Announcements, and Current User Status)
      const refreshRemoteState = useCallback(async () => {
        if (!supabaseClient) return null;
        try {
          const [cfgRes, holsRes, annsRes, sessRes] = await Promise.all([
            supabaseClient.from('app_config').select('*').eq('id', 1).single(),
            supabaseClient.from('public_holidays').select('*').eq('is_active', true).order('holiday_date', { ascending: true }),
            supabaseClient.from('announcements').select('*').eq('is_active', true).order('created_at', { ascending: false }),

          if (cfgRes.data) {
            setAppConfig((prev) => ({ ...prev, ...cfgRes.data }));
            Storage.set(KEYS.CONFIG, cfgRes.data);
          }
          if (holsRes.data && holsRes.data.length) {

            Storage.set(KEYS.HOLIDAYS, holsRes.data);

          if (annsRes.data) {

          const authUser = sessRes?.data?.session?.user;
          if (authUser) {
            const { data: prof, error: profErr } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('id', authUser.id)
              .maybeSingle();

            if (prof) {
              setProfile(prof);
              Storage.set(KEYS.PROFILE, prof);
              if (prof.account_status === 'approved') {
                supabaseClient.from('profiles').update({ last_active_at: new Date().toISOString() }).eq('id', authUser.id);
              }
            } else if (!profErr) {
              // If user previously had a profile and Admin deleted it, force sign out
              const cached = Storage.get(KEYS.PROFILE, null);
              if (cached && cached.id === authUser.id) {
                Storage.remove(KEYS.PROFILE);
                setProfile(null);
                await supabaseClient.auth.signOut();
                setAuthStage('welcome');
              } else {
                setAuthIdentity({

                  email: authUser.email || '',
                  phone: authUser.phone || '',

                setAuthStage('setup');

          return cfgRes.data || null;
        } catch {
          return null;

      // Silent Cloud Bootstrap, Google OAuth Listener & Realtime Subscriptions
      useEffect(() => {

        refreshRemoteState();

        const { data: authListener } = supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_IN' && session?.user) {
            refreshRemoteState();

            Storage.remove(KEYS.PROFILE);
            setProfile(null);
            setAuthStage('welcome');
          }

        const liveChannel = supabaseClient
          .channel('cd-live-sync')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => refreshRemoteState())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'app_config' }, () => refreshRemoteState())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'public_holidays' }, () => refreshRemoteState())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => refreshRemoteState())
          .subscribe();

        const onVis = () => { if (document.visibilityState === 'visible') refreshRemoteState(); };
        document.addEventListener('visibilitychange', onVis);
        const pollId = setInterval(() => refreshRemoteState(), 20000);

        return () => {
          document.removeEventListener('visibilitychange', onVis);
          clearInterval(pollId);
          try { authListener?.subscription?.unsubscribe(); } catch {}
          try { supabaseClient.removeChannel(liveChannel); } catch {}
        };

      // Keep shift selection synced with automatic weekly rotation when selectedDate or profile changes
      useEffect(() => {

      // Exact 1000ms UX Loader
      const runWithLoader = useCallback((fn, sound = 'tap') => {

      const getHolidayName = useCallback(

      // Compute pay for a given day & shift configuration
      const computeDayPay = useCallback(
        (dateIso, shiftType, exitTimeVal, customHrsVal) => {
          const dailyRate = Number(payroll.daily_rate || profile?.daily_rate || 143.36);
          const hourlyRate = Number(payroll.hourly_rate || dailyRate / 8);
          const holidayObj = holidayMap[dateIso] || null;
          const isHoliday = Boolean(holidayObj);
          const isSunday = getDayOfWeek(dateIso) === 0;

          let hours = 8;
          let startTime = '08:30';
          let endTime = '17:30';

          if (shiftType === 'normal') {
            startTime = '08:30';
            endTime = exitTimeVal || '17:30';
            hours = calcTimeDurationHours(startTime, endTime);
          } else if (shiftType === 'morning') {
            startTime = '06:00';
            endTime = '14:00';
            hours = 8;
          } else if (shiftType === 'afternoon') {
            startTime = '14:00';
            endTime = '22:00';
            hours = 8;
          } else if (shiftType === 'night') {
            startTime = '22:00';
            endTime = '06:00';
            hours = 8;
          } else if (shiftType === '12h') {
            startTime = '06:00';
            endTime = '18:00';
            hours = 12;
          } else if (shiftType === 'custom') {
            startTime = '08:00';
            hours = Math.max(0.5, Number(customHrsVal || 8));
            const endH = (8 + Math.floor(hours)) % 24;
            const endM = Math.round((hours % 1) * 60);
            endTime = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
          }

          let multiplier = 1;
          let gross = 0;
          const baseAmount = hours === 8 ? dailyRate : hours * hourlyRate;

          if (isHoliday) {
            multiplier = Number(holidayObj.multiplier || appConfig.holiday_multiplier || 2);
            gross = Number((baseAmount * multiplier).toFixed(2));
          } else if (isSunday) {
            const sundayFlat = Number(appConfig.default_sunday_rate || 430);
            multiplier = Number((sundayFlat / Math.max(1, dailyRate)).toFixed(2));
            gross = hours > 8 ? Number((sundayFlat + (hours - 8) * hourlyRate).toFixed(2)) : Number(sundayFlat.toFixed(2));
          } else {
            gross = Number(baseAmount.toFixed(2));
          }

          return {
            hours,
            startTime,
            endTime,
            isHoliday,
            holidayName: isHoliday ? getHolidayName(holidayObj) : '',
            isSunday,
            multiplier,
            gross,
          };
        },
        [payroll, profile, holidayMap, appConfig, getHolidayName]
      );

      // Selected date estimate
      const dayPreview = useMemo(

      /* =======================================================================
         ACTIONS: AUTH, REGISTRATION, PIN

      const handleGoogleSignIn = () => {
        runWithLoader(async () => {

      const handlePhonePasswordAuth = (e) => {
        e.preventDefault();

        if (digits.length < 9 || phonePassword.length < 6) {
          setPhoneAuthError(t.authErrorGeneric);

        setPhoneAuthError('');

        runWithLoader(async () => {
          let uid = 'local-' + normalized;

      const handleContractChange = (val) => {

      const updatePayrollField = (patch) => {
        setPayroll((prev) => {
          const next = { ...prev, ...patch };
          if (profile?.id) {
            SilentSync.enqueue({

          return next;

      /* =======================================================================
         COMPUTED AGGREGATIONS (ZERO DOUBLE-COUNTING)
         ======================================================================= */
      const cycleRecordsList = useMemo(() => {
        return Object.values(records)
          .filter((r) => r.work_date >= cycle.startIso && r.work_date <= cycle.endIso)
          .sort((a, b) => b.work_date.localeCompare(a.work_date));
      }, [records, cycle]);

      const allRecordsList = useMemo(() => {
        return Object.values(records).sort((a, b) => b.work_date.localeCompare(a.work_date));
      }, [records]);

      const cycleBonuses = useMemo(
        () => bonuses.filter((b) => b.cycle_key === cycle.cycleKey),
        [bonuses, cycle.cycleKey]
      );

      // Mutually exclusive buckets so every worked day is counted ONCE:
      // Priority: 1) Holiday x2 -> 2) Sunday -> 3) 12h/Custom -> 4) Standard 8h
      const walletStats = useMemo(() => {
        let holidaySum = 0, holidayDays = 0;
        let sundaySum = 0, sundayDays = 0;
        let longSum = 0, longDays = 0;
        let normalSum = 0, normalDays = 0;
        let paidWork = 0;
        let grossWork = 0;

        for (const r of cycleRecordsList) {
          if (r.status !== 'present') continue;
          const amt = Number(r.gross_amount || 0);
          grossWork += amt;
          if (r.is_paid) paidWork += amt;

          if (r.is_holiday) {
            holidaySum += amt;
            holidayDays += 1;
          } else if (r.is_sunday) {
            sundaySum += amt;
            sundayDays += 1;
          } else if (r.shift_type === '12h' || r.shift_type === 'custom' || Number(r.hours_worked) > 8) {
            longSum += amt;
            longDays += 1;
          } else {
            normalSum += amt;
            normalDays += 1;
          }
        }

        const bonusesExpected = cycleBonuses.reduce((s, b) => s + Number(b.expected_amount || 0), 0);
        const bonusesReceived = cycleBonuses.reduce((s, b) => s + Number(b.received_amount || 0), 0);

        const totalGross = grossWork + bonusesExpected;
        const totalPaid = paidWork + bonusesReceived;
        const totalRemaining = Math.max(0, totalGross - totalPaid);

        return {
          holidaySum, holidayDays,
          sundaySum, sundayDays,
          longSum, longDays,
          normalSum, normalDays,
          grossWork,
          bonusesExpected,
          bonusesReceived,
          bonusesMissing: Math.max(0, bonusesExpected - bonusesReceived),
          totalGross,
          totalPaid,
          totalRemaining,
        };
      }, [cycleRecordsList, cycleBonuses]);

      // Payroll Net Computation
      const payrollCalc = useMemo(() => {
        const totalGross = walletStats.grossWork + walletStats.bonusesReceived;
        const cnssBase = Math.min(totalGross, 6000);
        const cnssDed = payroll.cnss_enabled ? Number((cnssBase * 0.0448).toFixed(2)) : 0;
        const amoDed = payroll.amo_enabled ? Number((totalGross * 0.0226).toFixed(2)) : 0;
        const advanceDed = Number(payroll.salary_advance || 0);
        const netToPay = Math.max(0, Number((totalGross - cnssDed - amoDed - advanceDed).toFixed(2)));
        return { totalGross, cnssDed, amoDed, advanceDed, netToPay };
      }, [walletStats, payroll]);

      // Salary Simulator Computation
      const simCalc = useMemo(() => {
        const targetGross = Math.max(0, Number(simGross || 0));
        const dailyRate = Number(payroll.daily_rate || profile?.daily_rate || 143.36);
        const absDays = Math.max(0, Number(simAbsences || 0));
        const absenceCost = Number((absDays * dailyRate).toFixed(2));
        const adjustedGross = Math.max(0, targetGross - absenceCost);
        const cnssDed = simCnss ? Number((Math.min(adjustedGross, 6000) * 0.0448).toFixed(2)) : 0;
        const amoDed = simAmo ? Number((adjustedGross * 0.0226).toFixed(2)) : 0;
        const advDed = Math.max(0, Number(simAdvance || 0));
        const customDed = Math.max(0, Number(simCustomDed || 0));
        const totalDeductions = Number((absenceCost + cnssDed + amoDed + advDed + customDed).toFixed(2));
        const netRemaining = Math.max(0, Number((targetGross - totalDeductions).toFixed(2)));
        return { targetGross, absenceCost, cnssDed, amoDed, advDed, customDed, totalDeductions, netRemaining };
      }, [simGross, simAbsences, simAdvance, simCustomDed, simCnss, simAmo, payroll, profile]);

      // Filtered History
      const filteredHistory = useMemo(() => {
        const base = historyScope === 'cycle' ? cycleRecordsList : allRecordsList;
        return base.filter((r) => {
          if (historyFilter === 'all') return true;
          if (historyFilter === 'absent') return r.status === 'absent';
          if (historyFilter === 'paid') return r.status === 'present' && r.is_paid;
          if (historyFilter === 'unpaid') return r.status === 'present' && !r.is_paid;
          if (historyFilter === 'sunday') return r.status === 'present' && r.is_sunday;
          if (historyFilter === 'holiday') return r.status === 'present' && r.is_holiday;
          if (historyFilter === 'long')
            return r.status === 'present' && (r.shift_type === '12h' || r.shift_type === 'custom' || Number(r.hours_worked) > 8);
          if (historyFilter === 'h8')
            return r.status === 'present' && Number(r.hours_worked) <= 8 && !r.is_holiday && !r.is_sunday;

                      className="w-full p-3 rounded-2xl bg-[#EEF2F7]/70 hover:bg-[#EEF2F7] flex items-center gap-3 text-xs font-extrabold text-[#0B1D3A] active:scale-[0.98]"
                    >
                      <i className="fi fi-sr-interrogation text-[#00C29A] text-base"></i>
                      <span>{t.menuFaq}</span>
                    </button>

                    <button
                      onClick={handleCheckForUpdates}
                      className="w-full p-3 rounded-2xl bg-[#EEF2F7]/70 hover:bg-[#EEF2F7] flex items-center justify-between text-xs font-extrabold text-[#0B1D3A] active:scale-[0.98]"
                    >
                      <span className="flex items-center gap-3">
                        <i className="fi fi-sr-refresh text-[#00C29A] text-base"></i>
                        <span>{t.menuCheckUpdate}</span>
                      </span>
                      <LtrNum className="text-[10px] text-slate-400">v{APP_VERSION}</LtrNum>
                    </button>

                    <button
                      onClick={() => {
                        setDrawerOpen(false);
                        runWithLoader(() => setActiveOverlayScreen('about'), 'nav');
                      }}
                      className="w-full p-3 rounded-2xl bg-[#EEF2F7]/70 hover:bg-[#EEF2F7] flex items-center gap-3 text-xs font-extrabold text-[#0B1D3A] active:scale-[0.98]"
                    >
                      <i className="fi fi-sr-info text-[#00C29A] text-base"></i>
                      <span>{t.menuAbout}</span>
                    </button>

                    <button
                      onClick={() => requireProOrRun('excel_export', handleExportExcel)}
                      className="w-full p-3 rounded-2xl bg-emerald-50 hover:bg-emerald-100 flex items-center gap-3 text-xs font-extrabold text-emerald-900 active:scale-[0.98]"
                    >
                      <i className="fi fi-sr-file-excel text-[#009E7D] text-base"></i>
                      <span>{t.menuExportExcel}</span>
                    </button>

                    <button
                      onClick={() => { soundEngine.play('tap'); setShowPinModal(true); }}
                      className="w-full p-3 rounded-2xl bg-[#EEF2F7]/70 hover:bg-[#EEF2F7] flex items-center justify-between text-xs font-extrabold text-[#0B1D3A] active:scale-[0.98]"
                    >
                      <span className="flex items-center gap-3">
                        <i className="fi fi-sr-lock text-[#00C29A] text-base"></i>
                        <span>{t.menuPinLock}</span>
                      </span>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] ${pinHash ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                        {pinHash ? t.pinEnabled : t.pinDisabled}
                      </span>
                    </button>
                  </div>

                  {/* Language Switcher */}
                  <div className="pt-2 border-t border-slate-100">
                    <div className="text-[11px] font-bold text-slate-400 mb-2">{t.languageLabel}</div>
                    <div className="grid grid-cols-3 gap-1.5" dir="ltr">
                      {(['ar', 'fr', 'en']).map((code) => (
                        <button
                          key={code}
                          onClick={() => {
                            setDrawerOpen(false);
                            runWithLoader(() => setLang(code), 'nav');
                          }}
                          className={`py-2 rounded-xl text-xs font-extrabold transition ${
                            lang === code ? 'bg-[#0B1D3A] text-white' : 'bg-[#EEF2F7] text-slate-600'
                          }`}
                        >
                          {code === 'ar' ? 'العربية' : code === 'fr' ? 'FR' : 'EN'}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Sound Engine Toggle + 4-Button Sound Tester */}
                  <div className="pt-2 border-t border-slate-100 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-extrabold text-[#0B1D3A]">{t.menuSound}</span>
                      <button
                        onClick={() => {
                          const next = !soundMuted;
                          setSoundMuted(next);
                          soundEngine.setMuted(next);
                          if (!next) soundEngine.play('tap');
                        }}
                        className={`w-12 h-6 rounded-full transition relative ${
                          !soundMuted ? 'bg-[#00C29A]' : 'bg-slate-300'
                        }`}
                      >
                        <span
                          className={`w-4 h-4 rounded-full bg-white absolute top-1 transition-all ${
                            !soundMuted ? 'left-7' : 'left-1'
                          }`}
                        />
                      </button>
                    </div>

                    <div className="text-[11px] font-bold text-slate-400">{t.soundTester}</div>
                    <div className="grid grid-cols-4 gap-1.5">
                      {(['tap', 'success', 'coin', 'absent']).map((s) => (
                        <button
                          key={s}
                          onClick={() => soundEngine.play(s)}
                          className="py-2 px-1 rounded-xl bg-[#EEF2F7] hover:bg-slate-200 text-[10px] font-extrabold text-[#0B1D3A] active:scale-[0.95]"
                        >
                          {t.soundBtns[s]}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Logout */}
                <button
                  onClick={handleLogout}
                  className="mt-6 w-full py-3 rounded-2xl bg-rose-50 text-rose-700 font-extrabold text-xs flex items-center justify-center gap-2 active:scale-[0.97]"
                >
                  <i className="fi fi-sr-sign-out-alt"></i>
                  <span>{t.logoutBtn}</span>
                </button>
              </aside>
            </div>
          )}

          {/* =================================================================
              LOCAL PIN MODAL
             ================================================================= */}
          {showPinModal && (
            <div className="fixed inset-0 z-50 bg-[#0B1D3A]/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="fintech-card max-w-xs w-full p-5 space-y-4 animate-fade-up">
                <h3 className="text-base font-extrabold text-[#0B1D3A] text-center">{t.pinModalTitle}</h3>
                <p className="text-xs text-slate-500 text-center">{t.pinEnter4}</p>
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={4}
                  dir="ltr"
                  value={newPinInput}
                  onChange={(e) => setNewPinInput(e.target.value.replace(/\D/g, '').slice(0, 4))}
                  placeholder="••••"
                  className="w-full py-3 rounded-2xl bg-[#EEF2F7] text-center font-mono-num text-2xl tracking-[0.5em] font-bold focus:outline-none focus:ring-2 focus:ring-[#00C29A]"
                />
                <div className="flex gap-2">
                  <button
                    onClick={handleSaveNewPin}
                    className="flex-1 py-2.5 rounded-xl bg-[#00C29A] text-[#0B1D3A] text-xs font-extrabold active:scale-[0.97]"
                  >
                    {t.pinSave}
                  </button>
                  {pinHash && (
                    <button
                      onClick={handleDisablePin}
                      className="px-3 py-2.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-extrabold active:scale-[0.97]"
                    >
                      {t.pinRemove}
                    </button>
                  )}
                </div>
                <button
                  onClick={() => setShowPinModal(false)}
                  className="w-full py-2 text-xs font-bold text-slate-500"
                >
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* =================================================================
              UPGRADED EXECUTIVE PAYSLIP MODAL (Download + Print)
             ================================================================= */}
          {showPayslip && (
            <div className="fixed inset-0 z-50 bg-[#0B1D3A]/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div id="printable-payslip" className="bg-white rounded-[24px] max-w-md w-full overflow-hidden shadow-2xl animate-fade-up my-auto">
                {/* Executive Header */}
                <div className="hero-gradient p-5 text-white flex items-center justify-between gap-3">
                  <div>
                    <CheckDayLogo size={30} light />
                    <div className="text-[11px] text-[#6EE7D2] font-bold mt-1">{t.payslipSubtitle}</div>
                  </div>
                  <div className="text-end">
                    <div className="text-[10px] text-slate-300">{t.cycleLabel}</div>
                    <LtrNum className="text-xs font-bold text-white">{cycle.startIso} → {cycle.endIso}</LtrNum>
                  </div>
                </div>

                <div className="p-5 space-y-4">
                  {/* Worker Identity Box */}
                  <div className="p-3.5 rounded-2xl bg-[#EEF2F7] flex items-center justify-between gap-2 text-xs">
                    <div>
                      <div className="font-extrabold text-[#0B1D3A] text-sm">{profile.full_name}</div>
                      <div className="text-slate-500 mt-0.5">
                        {t.contracts[profile.contract_type]} · {t.shifts[profile.shift_category]}
                      </div>
                    </div>
                    <LtrNum className="px-2.5 py-1 rounded-xl bg-white font-extrabold text-[#0B1D3A] shadow-xs">
                      #{profile.matricule}
                    </LtrNum>
                  </div>

                  {/* Itemized Earnings & Deductions */}
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.catHoliday} (<LtrNum>{walletStats.holidayDays}</LtrNum>)</span>
                      <LtrNum className="font-bold text-[#0B1D3A]">{fmtMoney(walletStats.holidaySum, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.catSunday} (<LtrNum>{walletStats.sundayDays}</LtrNum>)</span>
                      <LtrNum className="font-bold text-[#0B1D3A]">{fmtMoney(walletStats.sundaySum, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.catLong} (<LtrNum>{walletStats.longDays}</LtrNum>)</span>
                      <LtrNum className="font-bold text-[#0B1D3A]">{fmtMoney(walletStats.longSum, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.catNormal} (<LtrNum>{walletStats.normalDays}</LtrNum>)</span>
                      <LtrNum className="font-bold text-[#0B1D3A]">{fmtMoney(walletStats.normalSum, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.bonusesReceived}</span>
                      <LtrNum className="font-bold text-[#009E7D]">+{fmtMoney(walletStats.bonusesReceived, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.cnssDeduction}</span>
                      <LtrNum className="font-bold text-rose-600">-{fmtMoney(payrollCalc.cnssDed, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="text-slate-500">{t.amoDeduction}</span>
                      <LtrNum className="font-bold text-rose-600">-{fmtMoney(payrollCalc.amoDed, t.currency)}</LtrNum>
                    </div>
                    <div className="flex justify-between py-1">
                      <span className="text-slate-500">{t.advanceDeduction}</span>
                      <LtrNum className="font-bold text-rose-600">-{fmtMoney(payrollCalc.advanceDed, t.currency)}</LtrNum>
                    </div>
                  </div>

                  {/* Highlighted Net to Pay Box */}
                  <div className="rounded-2xl bg-[#0B1D3A] text-white p-4 flex items-center justify-between">
                    <span className="text-xs font-extrabold">{t.netToPay}</span>
                    <LtrNum className="text-xl font-extrabold text-[#6EE7D2]">
                      {fmtMoney(payrollCalc.netToPay, t.currency)}
                    </LtrNum>
                  </div>

                  {/* Actions: Download + Print + WhatsApp Share + Close */}
                  <div className="grid grid-cols-2 gap-2 no-print">
                    <button
                      type="button"
                      onClick={handleShareWhatsApp}
                      className="col-span-2 py-3 rounded-2xl bg-emerald-600 text-white text-xs font-extrabold flex items-center justify-center gap-2 active:scale-[0.97]"
                    >
                      <i className="fi fi-sr-paper-plane"></i>
                      <span>{t.shareWhatsapp}</span>
                      <span className="px-1.5 py-0.5 rounded-md bg-amber-400 text-[#0B1D3A] text-[9px] font-black">{t.proBadge}</span>
                    </button>
                    <button
                      type="button"
                      onClick={handleDownloadPayslipFile}
                      className="py-3 rounded-2xl bg-[#00C29A] text-[#0B1D3A] text-xs font-extrabold flex items-center justify-center gap-1.5 active:scale-[0.97]"
                    >
                      <i className="fi fi-sr-download"></i>
                      <span>{t.downloadPayslip}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => { soundEngine.play('tap'); try { window.print(); } catch {} }}
                      className="py-3 rounded-2xl bg-[#0B1D3A] text-white text-xs font-extrabold flex items-center justify-center gap-1.5 active:scale-[0.97]"
                    >
                      <i className="fi fi-sr-print text-[#00C29A]"></i>
                      <span>{t.printNow}</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowPayslip(false)}
                      className="col-span-2 py-2.5 rounded-2xl bg-[#EEF2F7] text-[#0B1D3A] text-xs font-bold active:scale-[0.97]"
                    >
                      {t.closeBtn}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* UPDATE AVAILABLE MODAL */}
          {showUpdateModal && (
            <div className="fixed inset-0 z-50 bg-[#0B1D3A]/55 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="fintech-card max-w-xs w-full p-6 text-center space-y-4 animate-fade-up">
                <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-[#00C29A] flex items-center justify-center mx-auto">
                  <i className="fi fi-sr-rocket-lunch text-2xl"></i>
                </div>
                <h3 className="text-base font-extrabold text-[#0B1D3A]">{t.updateAvailableTitle}</h3>
                <p className="text-xs text-slate-500">
                  {t.updateAvailableBody} (<LtrNum>v{appConfig.min_version}</LtrNum>)
                </p>
                {appConfig.update_url && (
                  <a
                    href={appConfig.update_url}
                    target="_blank"
                    rel="noreferrer"
                    className="block w-full py-3 rounded-2xl bg-[#00C29A] text-[#0B1D3A] text-xs font-extrabold"
                  >
                    {t.updateNow}
                  </a>
                )}
                <button
                  type="button"
                  onClick={() => setShowUpdateModal(false)}
                  className="w-full py-2 text-xs font-bold text-slate-500"
                >
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* =================================================================
              1-SECOND CENTERED TRANSLUCENT ACTION LOADER
             ================================================================= */}
          {loadingOverlay && (
            <div className="fixed inset-0 z-50 bg-[#0B1D3A]/35 backdrop-blur-sm flex items-center justify-center">
              <div className="bg-white/95 rounded-3xl px-7 py-6 shadow-2xl flex flex-col items-center gap-3">
                <div className="loader-ring"><CheckDayLogo size={46} showWordmark={false} /></div>
                <span className="text-xs font-bold text-[#0B1D3A]">{t.loading}</span>
              </div>
            </div>
          )}

          {/* CHECKDAY PRO UPGRADE MODAL */}
          {showProModal && (
            <div className="fixed inset-0 z-50 bg-[#0B1D3A]/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="fintech-card max-w-xs w-full p-6 text-center space-y-4 animate-fade-up">
                <div className="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto">
                  <i className="fi fi-sr-crown text-2xl"></i>
                </div>
                <h3 className="text-base font-extrabold text-[#0B1D3A]">{t.proModalTitle}</h3>
                <p className="text-xs text-slate-600 leading-relaxed">{t.proModalBody}</p>
                <div className="p-3 rounded-2xl bg-[#EEF2F7] font-extrabold text-[#0B1D3A] text-sm">
                  <LtrNum>{proPrice} {t.proMonthlyUnit}</LtrNum>
                </div>
                <p className="text-[11px] text-slate-500">{t.proUnlockHint}</p>
                <button
                  type="button"
                  onClick={() => setShowProModal(false)}
                  className="w-full py-3 rounded-2xl bg-[#0B1D3A] text-white text-xs font-extrabold"
                >
                  {t.closeBtn}
                </button>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl shadow-lg text-xs font-extrabold text-white bg-[#0B1D3A] border border-white/10 animate-fade-up">
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    function FaqScreen({ t, onClose }) {
      const [openIdx, setOpenIdx] = useState(0);
      return (
        <div className="space-y-4 animate-fade-up">
          <div className="flex items-center justify-between">
            <h1 className="text-lg font-extrabold text-[#0B1D3A]">{t.faqTitle}</h1>
            <button
              onClick={onClose}
              className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 text-xs font-bold text-[#0B1D3A] active:scale-[0.97]"
            >
              {t.backBtn}
            </button>
          </div>
          <div className="space-y-2.5">
            {t.faqs.map((item, idx) => {
              const isOpen = openIdx === idx;
              return (
                <div key={idx} className="fintech-card overflow-hidden">
                  <button
                    onClick={() => { soundEngine.play('tap'); setOpenIdx(isOpen ? -1 : idx); }}
                    className="w-full p-4 flex items-center justify-between gap-3 text-start"
                  >
                    <span className="text-xs font-extrabold text-[#0B1D3A] leading-relaxed">{item.q}</span>
                    <i className={`fi fi-sr-angle-small-down text-base text-[#00C29A] transition-transform ${isOpen ? 'rotate-180' : ''}`}></i>
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4 text-xs text-slate-600 leading-relaxed border-t border-slate-100 pt-3">
                      {item.a}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
